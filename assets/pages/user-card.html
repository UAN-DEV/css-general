<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User card</title>
    <link rel="stylesheet" href="../style/user-card.css" />
    <link rel="stylesheet" href="https://cloudflare.com" />
  </head>
  <body>
    <div class="card-contaiter">
      <div class="header"></div>
      <div class="info-container">
        <div class="info-header">
          <div class="img-container">
            <img src="../images/Том_Круз.jpg" alt="card foto" />
          </div>
          <h1>Tom Cruise</h1>
          <p class="hash-tag">tom_cruise</p>
        </div>
        <div class="info-main">
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Totam, dicta earum magnam quibusdam sunt, quidem
            laborum reprehenderit explicabo, ullam consequuntur alias. Nostrum quisquam optio ex consectetur commodi,
            exercitationem cumque aperiam.
          </p>
        </div>
      </div>
      <div class="footer">
        <div class="social-icons-block">
          <div class="social-icon"><img src="../icons/icons8-twitter-64.png" alt="twitter" /></div>
          <div class="social-icon"><img src="../icons/icons8-linkedin-94.png" alt="" /></div>
          <div class="social-icon"><img src="../icons/icons8-facebook-48.png" alt="facebook" /></div>
        </div>
      </div>
      <!-- не получилось подключить иконки -->
      <div class="social-icons-block">
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-linkedin"></i>
      </div>
    </div>
  </body>
</html>
